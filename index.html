<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>doodles faces: username to ink avatar</title>
    <meta name="description" content="Type a name. Get a graphite doodle face. Same name, same face. Pure JavaScript, no AI." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f3eee2" />
    <link rel="canonical" href="https://doodlefaces.site/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="doodles faces" />
    <meta property="og:title" content="doodles faces: username to ink avatar" />
    <meta property="og:description" content="Type a name. Get a graphite doodle face. Same name, same face." />
    <meta property="og:image" content="https://doodlefaces.site/api/og?u=ada" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A grid of graphite doodle faces on cream paper" />
    <meta property="og:url" content="https://doodlefaces.site/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="doodles faces: username to ink avatar" />
    <meta name="twitter:description" content="Type a name. Get a graphite doodle face. Same name, same face." />
    <meta name="twitter:image" content="https://doodlefaces.site/api/og?u=ada" />
    <meta name="twitter:image:alt" content="A grid of graphite doodle faces on cream paper" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "doodles faces",
        "url": "https://doodlefaces.site/",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Web",
        "description": "Type a name and get a unique hand-drawn ink avatar. Same name, same face.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div class="sheet">
      <section class="hero">
        <canvas id="hero" width="1280" height="420" aria-hidden="true"></canvas>
        <div class="hero-text">
          <h1 class="brand">doodles faces</h1>
          <p class="lede">your name, drawn by a pencil. click a face and it becomes someone else.</p>
        </div>
        <div class="stamp">no ai · seed art · paper</div>
      </section>

      <div class="desk">
        <div class="stage" id="stage">
          <canvas id="c" width="900" height="900" aria-label="generated face"></canvas>
          <div class="hint" id="hint">same name, same face</div>
        </div>

        <aside class="panel">
          <div>
            <label for="seed-name">your name</label>
            <div class="row">
              <input id="seed-name" name="seed-name" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true" placeholder="type a name" maxlength="64" />
              <button id="rand" class="ghost icon-btn" type="button" title="random name"><i data-lucide="dices"></i><span class="sr">random</span></button>
            </div>
          </div>
          <div>
            <label for="with">draw with</label>
            <input id="with" name="draw-with" type="text" autocomplete="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true" placeholder="optional other name" maxlength="64" />
          </div>
          <div class="tabs" role="tablist">
            <button id="solo" class="ghost" type="button" aria-pressed="true"><i data-lucide="user"></i>portrait</button>
            <button id="crowd" class="ghost" type="button" aria-pressed="false"><i data-lucide="users"></i>crowd</button>
          </div>
          <p class="caption" id="caption">egg · bags · bowl</p>
          <div class="meta">
            <span>@<b id="who">—</b></span>
            <span>seed <b id="seedLabel">—</b></span>
          </div>
          <div class="actions">
            <button id="share" class="ghost" type="button"><i data-lucide="share-2"></i>share</button>
            <button id="png" type="button"><i data-lucide="download"></i>save png</button>
          </div>
        </aside>
      </div>

      <footer>
        <span>graphite on cream · javascript only</span>
        <span class="links">
          <a href="https://x.com/mannay/status/2087522034351796728"><i data-lucide="sparkles"></i>inspiration: mannay</a>
          <a href="https://github.com/bolechen/doodles-faces"><i data-lucide="git-fork"></i>open source</a>
        </span>
      </footer>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
