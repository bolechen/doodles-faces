<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>doodles-faces</title>
<meta name="description" content="Type a username → get a hand-drawn face. Pure JS, no AI. Shareable & downloadable." />
<meta name="theme-color" content="#e9e4d8" />
<meta property="og:title" content="doodles-faces" />
<meta property="og:description" content="Username → unique ink doodle avatar. Same name, same face." />
<style>
  :root {
    --paper: #e9e4d8;
    --paper2: #dfd8c8;
    --ink: #241f1a;
    --muted: #6b635a;
    --line: #c9c2b4;
    --panel: #f4efe4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; background: var(--paper2); color: var(--ink);
    font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: grid; place-items: center; padding: 24px 16px;
  }
  main {
    width: min(420px, 100%);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px 20px 18px;
    box-shadow: 0 1px 0 #fff8 inset, 0 10px 30px #0000000d;
  }
  header { margin-bottom: 16px; }
  h1 {
    font-size: 15px; font-weight: 650; margin: 0 0 4px;
    letter-spacing: .02em;
  }
  header p { margin: 0; color: var(--muted); font-size: 12px; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px;
  }
  .row { display: flex; gap: 8px; }
  #user {
    flex: 1; min-width: 0;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    outline: none;
  }
  #user:focus { border-color: var(--ink); }
  #user::placeholder { color: #a3998c; }
  button {
    padding: 10px 12px;
    border: 1px solid var(--ink);
    border-radius: 10px;
    background: var(--ink);
    color: var(--paper);
    font: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  button.ghost { background: transparent; color: var(--ink); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .55; cursor: default; transform: none; }
  .stage {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    background: var(--paper);
    aspect-ratio: 1;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .meta {
    display: flex; justify-content: space-between; gap: 10px;
    margin-top: 10px; font-size: 11px; color: var(--muted);
  }
  .meta b { color: var(--ink); font-weight: 600; word-break: break-all; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions button { flex: 1; }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(8px);
    background: var(--ink); color: var(--paper); font-size: 12px;
    padding: 8px 12px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
<main>
  <header>
    <h1>doodles·faces</h1>
    <p>username → ink avatar · same name, same face</p>
  </header>

  <div class="field">
    <label for="user">username</label>
    <div class="row">
      <input id="user" type="text" autocomplete="username" spellcheck="false"
        placeholder="type a name…" maxlength="64" />
      <button id="rand" class="ghost" type="button" title="random name">rnd</button>
    </div>
  </div>

  <div class="stage">
    <canvas id="c" width="720" height="720" aria-label="avatar"></canvas>
  </div>

  <div class="meta">
    <span>@<b id="who">—</b></span>
    <span>seed <b id="seedLabel">—</b></span>
  </div>

  <div class="actions">
    <button id="share" class="ghost" type="button">share</button>
    <button id="png" type="button">download</button>
  </div>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
// --- rng ---
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rngOf = (seed) => {
  const r = mulberry32(seed >>> 0);
  return {
    f: r,
    range: (a, b) => a + r() * (b - a),
    int: (a, b) => a + Math.floor(r() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(r() * arr.length)],
    chance: (p) => r() < p,
  };
};

// FNV-1a → stable u32 seed from any string
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// --- geometry ---
function ellipse(cx, cy, rx, ry, n, warp, rng) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const k = 1
      + warp * Math.sin(a * 2 + rng.range(0, 6))
      + warp * 0.6 * Math.cos(a * 3 + rng.range(0, 4));
    pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
  }
  return pts;
}
function arcPts(cx, cy, rx, ry, a0, a1, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const a = a0 + (a1 - a0) * t;
    pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
  }
  return pts;
}
function catmull(pts, closed, samples = 8) {
  if (pts.length < 2) return pts.slice();
  const p = pts.slice();
  if (closed) {
    p.unshift(pts[pts.length - 1]);
    p.push(pts[0], pts[1]);
  } else {
    p.unshift(pts[0]);
    p.push(pts[pts.length - 1]);
  }
  const out = [];
  const segs = closed ? pts.length : pts.length - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = p[i], p1 = p[i + 1], p2 = p[i + 2], p3 = p[i + 3];
    for (let j = 0; j < samples; j++) {
      const t = j / samples, t2 = t * t, t3 = t2 * t;
      out.push([
        0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3),
      ]);
    }
  }
  if (!closed) out.push(pts[pts.length - 1]);
  return out;
}

// --- ink brush ---
function ink(ctx, pts, rng, {
  width = 2, closed = false, passes = 2, jitter = 1.1, color = '#241f1a', smooth = true,
} = {}) {
  const path = smooth ? catmull(pts, closed, 6) : pts.slice();
  if (!path.length) return;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (let p = 0; p < passes; p++) {
    ctx.beginPath();
    for (let i = 0; i < path.length; i++) {
      const jx = (rng.f() - 0.5) * jitter * 2;
      const jy = (rng.f() - 0.5) * jitter * 2;
      const x = path[i][0] + jx, y = path[i][1] + jy;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    if (closed) ctx.closePath();
    ctx.lineWidth = Math.max(0.6, width * (0.75 + rng.f() * 0.55));
    ctx.globalAlpha = 0.82 + rng.f() * 0.18;
    ctx.stroke();
  }
  ctx.restore();
}
function fillDots(ctx, cx, cy, r, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// --- face DNA ---
function buildFace(seed) {
  const rng = rngOf(seed);
  return {
    seed,
    rx: rng.range(0.84, 1.16),
    ry: rng.range(0.9, 1.18),
    warp: rng.range(0.04, 0.12),
    yaw: rng.range(-0.55, 0.55),
    eye: rng.pick(['round', 'dead', 'squint', 'wide', 'bags']),
    brow: rng.pick(['flat', 'raise', 'worry', 'unibrow', 'none']),
    nose: rng.pick(['line', 'hook', 'dot', 'button']),
    mouth: rng.pick(['flat', 'smile', 'frown', 'open', 'smirk']),
    hair: rng.pick(['none', 'bowl', 'spikes', 'curl', 'side', 'buzz', 'hat']),
    facial: rng.pick(['none', 'none', 'stubble', 'mustache', 'goatee']),
    glasses: rng.chance(0.22) ? rng.pick(['round', 'square', 'shades']) : 'none',
    ear: rng.chance(0.85),
    ink: rng.pick(['#241f1a', '#241f1a', '#241f1a', '#4a3423', '#2f3b45', '#6f3327']),
  };
}

function drawFace(ctx, cx, cy, s, dna) {
  const rng = rngOf(dna.seed * 9973 + 13);
  const inkC = dna.ink;
  const yaw = dna.yaw;
  const rx = 36 * s * dna.rx;
  const ry = 46 * s * dna.ry;
  const ox = yaw * rx * 0.35;

  if (rng.chance(0.7)) {
    ink(ctx, [[cx - 10 * s, cy + ry * 0.85], [cx - 6 * s, cy + ry * 1.25], [cx + 6 * s, cy + ry * 1.25], [cx + 10 * s, cy + ry * 0.85]], rng, {
      width: 1.8 * s, passes: 1, jitter: 0.7, color: inkC,
    });
  }

  if (dna.ear && Math.abs(yaw) < 0.45) {
    for (const side of [-1, 1]) {
      const ex = cx + side * rx * 0.98;
      ink(ctx, ellipse(ex, cy + 2 * s, 5.5 * s, 9 * s, 12, 0.05, rng).slice(2, 10), rng, {
        width: 1.8 * s, passes: 2, jitter: 0.8, color: inkC,
      });
    }
  }

  const head = ellipse(cx + ox * 0.15, cy, rx, ry, 26, dna.warp, rng);
  ink(ctx, head, rng, { width: 2.8 * s, closed: true, passes: 3, jitter: 1.35, color: inkC });
  drawHair(ctx, cx + ox * 0.1, cy, rx, ry, s, dna, rng, inkC);

  const eyeY = cy - 4 * s;
  const gap = 13 * s * (1 - Math.abs(yaw) * 0.25);
  if (dna.brow !== 'none') {
    for (const side of [-1, 1]) {
      if (side * yaw < -0.4) continue;
      const bx = cx + ox + side * gap;
      const by = eyeY - 11 * s;
      if (dna.brow === 'unibrow' && side === 1) continue;
      if (dna.brow === 'unibrow') {
        ink(ctx, [[cx + ox - gap - 6 * s, by], [cx + ox + gap + 6 * s, by - 1 * s]], rng, {
          width: 3.2 * s, passes: 2, jitter: 0.9, color: inkC,
        });
      } else if (dna.brow === 'raise') {
        ink(ctx, arcPts(bx, by + 8 * s, 12 * s, 10 * s, Math.PI * 1.15, Math.PI * 1.85, 6), rng, {
          width: 2.2 * s, passes: 2, jitter: 0.8, color: inkC,
        });
      } else if (dna.brow === 'worry') {
        ink(ctx, [[bx - 8 * s * side, by + 2 * s], [bx + 8 * s * side, by - 3 * s]], rng, {
          width: 2.2 * s, passes: 2, jitter: 0.8, color: inkC,
        });
      } else {
        ink(ctx, [[bx - 8 * s, by], [bx + 8 * s, by - 1 * s]], rng, {
          width: 2.2 * s, passes: 2, jitter: 0.8, color: inkC,
        });
      }
    }
  }

  for (const side of [-1, 1]) {
    if (side * yaw < -0.5) continue;
    const ex = cx + ox + side * gap * (1 + yaw * side * 0.08);
    drawEye(ctx, ex, eyeY, s, dna.eye, rng, inkC, side, yaw);
  }

  if (dna.glasses !== 'none') drawGlasses(ctx, cx + ox, eyeY, gap, s, dna.glasses, rng, inkC);

  const nx = cx + ox * 1.4;
  const ny0 = cy - 2 * s;
  const ny1 = cy + 12 * s;
  if (dna.nose === 'dot') {
    fillDots(ctx, nx + rng.range(-1, 1), ny1, 1.6 * s, inkC);
  } else if (dna.nose === 'button') {
    ink(ctx, arcPts(nx, ny1 - 2 * s, 6 * s, 5 * s, 0.2, Math.PI - 0.2, 7), rng, {
      width: 1.8 * s, passes: 2, jitter: 0.7, color: inkC,
    });
  } else if (dna.nose === 'hook') {
    ink(ctx, [[nx, ny0], [nx - 3 * s + yaw * 4, cy + 6 * s], [nx + 2 * s, ny1], [nx + 8 * s, ny1 + 2 * s]], rng, {
      width: 2.1 * s, passes: 2, jitter: 0.9, color: inkC,
    });
  } else {
    ink(ctx, [[nx, ny0], [nx + yaw * 5 * s, ny1], [nx + 6 * s * Math.sign(yaw || 1) * (rng.chance(0.5) ? 1 : 0.3), ny1 + 1 * s]], rng, {
      width: 2 * s, passes: 2, jitter: 0.85, color: inkC,
    });
  }

  const my = cy + 24 * s;
  const mx = cx + ox * 0.9;
  if (dna.mouth === 'open') {
    ink(ctx, ellipse(mx, my + 2 * s, 8 * s, 5 * s, 14, 0.04, rng), rng, {
      width: 2 * s, closed: true, passes: 2, jitter: 0.8, color: inkC,
    });
  } else if (dna.mouth === 'smile') {
    ink(ctx, arcPts(mx, my - 4 * s, 12 * s, 10 * s, 0.25, Math.PI - 0.25, 8), rng, {
      width: 2.1 * s, passes: 2, jitter: 0.8, color: inkC,
    });
  } else if (dna.mouth === 'frown') {
    ink(ctx, arcPts(mx, my + 10 * s, 11 * s, 9 * s, Math.PI + 0.3, Math.PI * 2 - 0.3, 8), rng, {
      width: 2.1 * s, passes: 2, jitter: 0.8, color: inkC,
    });
  } else if (dna.mouth === 'smirk') {
    ink(ctx, [[mx - 10 * s, my], [mx, my + 3 * s], [mx + 12 * s, my - 4 * s]], rng, {
      width: 2.1 * s, passes: 2, jitter: 0.8, color: inkC,
    });
  } else {
    ink(ctx, [[mx - 11 * s, my], [mx + 11 * s, my + rng.range(-2, 2)]], rng, {
      width: 2 * s, passes: 2, jitter: 0.75, color: inkC,
    });
  }

  if (dna.facial === 'mustache') {
    ink(ctx, [[mx - 10 * s, my - 6 * s], [mx, my - 2 * s], [mx + 10 * s, my - 6 * s]], rng, {
      width: 3 * s, passes: 2, jitter: 1, color: inkC,
    });
  } else if (dna.facial === 'goatee') {
    ink(ctx, [[mx - 4 * s, my + 6 * s], [mx, my + 16 * s], [mx + 4 * s, my + 6 * s]], rng, {
      width: 2.2 * s, closed: true, passes: 2, jitter: 0.9, color: inkC,
    });
  } else if (dna.facial === 'stubble') {
    for (let i = 0; i < 18; i++) {
      const x = mx + rng.range(-14, 14) * s;
      const y = my + rng.range(-2, 14) * s;
      ink(ctx, [[x, y], [x + rng.range(-1.5, 1.5), y + rng.range(1, 3)]], rng, {
        width: 1, passes: 1, jitter: 0.3, color: inkC, smooth: false,
      });
    }
  }
}

function drawEye(ctx, ex, ey, s, kind, rng, inkC, side, yaw) {
  const squash = 1 - Math.abs(yaw) * 0.25;
  if (kind === 'squint') {
    ink(ctx, [[ex - 7 * s, ey], [ex + 7 * s, ey + side * yaw]], rng, {
      width: 2 * s, passes: 2, jitter: 0.7, color: inkC,
    });
    return;
  }
  if (kind === 'dead') {
    ink(ctx, arcPts(ex, ey, 7 * s * squash, 3.2 * s, 0.15, Math.PI - 0.15, 6), rng, {
      width: 2 * s, passes: 2, jitter: 0.7, color: inkC,
    });
    ink(ctx, arcPts(ex, ey, 7 * s * squash, 3.2 * s, Math.PI + 0.15, Math.PI * 2 - 0.15, 6), rng, {
      width: 1.6 * s, passes: 1, jitter: 0.6, color: inkC,
    });
    fillDots(ctx, ex + yaw * 2, ey + 0.5 * s, 1.3 * s, inkC);
    return;
  }
  if (kind === 'wide') {
    ink(ctx, ellipse(ex, ey, 8 * s * squash, 6.5 * s, 14, 0.03, rng), rng, {
      width: 2.1 * s, closed: true, passes: 2, jitter: 0.85, color: inkC,
    });
    fillDots(ctx, ex + yaw * 2, ey, 2.2 * s, inkC);
    return;
  }
  ink(ctx, ellipse(ex, ey, 6.5 * s * squash, 4.5 * s, 14, 0.04, rng), rng, {
    width: 2 * s, closed: true, passes: 2, jitter: 0.85, color: inkC,
  });
  fillDots(ctx, ex + yaw * 2 + rng.range(-0.6, 0.6), ey + rng.range(-0.4, 0.4), 1.7 * s, inkC);
  if (kind === 'bags') {
    ink(ctx, arcPts(ex, ey + 7 * s, 7 * s, 4 * s, 0.2, Math.PI - 0.2, 6), rng, {
      width: 1.5 * s, passes: 1, jitter: 0.6, color: inkC,
    });
  }
}

function drawGlasses(ctx, cx, ey, gap, s, kind, rng, inkC) {
  const r = kind === 'square' ? null : 9 * s;
  for (const side of [-1, 1]) {
    const x = cx + side * gap;
    if (kind === 'square') {
      const hw = 9 * s, hh = 7 * s;
      ink(ctx, [[x - hw, ey - hh], [x + hw, ey - hh], [x + hw, ey + hh], [x - hw, ey + hh]], rng, {
        width: 2 * s, closed: true, passes: 2, jitter: 0.6, color: inkC,
      });
    } else {
      ink(ctx, ellipse(x, ey, r, r * 0.85, 16, 0.02, rng), rng, {
        width: kind === 'shades' ? 2.4 * s : 2 * s, closed: true, passes: 2, jitter: 0.6, color: inkC,
      });
    }
    if (kind === 'shades') {
      for (let i = -3; i <= 3; i++) {
        ink(ctx, [[x - 7 * s, ey + i * 2.2 * s], [x + 7 * s, ey + i * 2.2 * s]], rng, {
          width: 1.2 * s, passes: 1, jitter: 0.3, color: inkC, smooth: false,
        });
      }
    }
  }
  ink(ctx, [[cx - gap + 9 * s, ey], [cx + gap - 9 * s, ey]], rng, {
    width: 1.6 * s, passes: 1, jitter: 0.4, color: inkC,
  });
}

function drawHair(ctx, cx, cy, rx, ry, s, dna, rng, inkC) {
  const kind = dna.hair;
  if (kind === 'none') return;
  if (kind === 'bowl') {
    const pts = arcPts(cx, cy - ry * 0.15, rx * 1.05, ry * 0.95, Math.PI * 1.05, Math.PI * 1.95, 14);
    ink(ctx, pts, rng, { width: 5.5 * s, passes: 3, jitter: 1.2, color: inkC });
    ink(ctx, pts, rng, { width: 8 * s, passes: 1, jitter: 1.5, color: inkC });
  } else if (kind === 'spikes') {
    const n = rng.int(5, 8);
    for (let i = 0; i < n; i++) {
      const a = Math.PI * 1.1 + (i / (n - 1)) * Math.PI * 0.8;
      const x0 = cx + Math.cos(a) * rx * 0.92;
      const y0 = cy + Math.sin(a) * ry * 0.92;
      const x1 = cx + Math.cos(a) * rx * rng.range(1.2, 1.55);
      const y1 = cy + Math.sin(a) * ry * rng.range(1.05, 1.35) - rng.range(4, 12) * s;
      ink(ctx, [[x0, y0], [(x0 + x1) / 2 + rng.range(-3, 3), (y0 + y1) / 2], [x1, y1]], rng, {
        width: 2.2 * s, passes: 2, jitter: 0.9, color: inkC,
      });
    }
  } else if (kind === 'curl') {
    const n = rng.int(8, 14);
    for (let i = 0; i < n; i++) {
      const a = Math.PI * 1.05 + (i / (n - 1)) * Math.PI * 0.9;
      const x = cx + Math.cos(a) * rx * rng.range(0.85, 1.05);
      const y = cy + Math.sin(a) * ry * rng.range(0.75, 1) - 4 * s;
      ink(ctx, ellipse(x, y, rng.range(4, 7) * s, rng.range(4, 7) * s, 10, 0.08, rng), rng, {
        width: 1.5 * s, closed: true, passes: 1, jitter: 0.7, color: inkC,
      });
    }
  } else if (kind === 'side') {
    const dir = rng.chance(0.5) ? 1 : -1;
    for (let i = 0; i < 6; i++) {
      const a = Math.PI * 1.15 + i * 0.12;
      ink(ctx, [
        [cx + Math.cos(a) * rx * 0.9, cy + Math.sin(a) * ry * 0.85],
        [cx + dir * rx * rng.range(0.9, 1.3), cy - ry * rng.range(0.1, 0.6)],
      ], rng, { width: 2.4 * s, passes: 2, jitter: 1, color: inkC });
    }
  } else if (kind === 'buzz') {
    for (let i = 0; i < 22; i++) {
      const a = Math.PI * 1.05 + (i / 21) * Math.PI * 0.9;
      const x = cx + Math.cos(a) * rx * 0.95;
      const y = cy + Math.sin(a) * ry * 0.95;
      ink(ctx, [[x, y], [x + rng.range(-2, 2), y - rng.range(2, 5) * s]], rng, {
        width: 1.2, passes: 1, jitter: 0.4, color: inkC, smooth: false,
      });
    }
  } else if (kind === 'hat') {
    ink(ctx, arcPts(cx, cy - ry * 0.35, rx * 1.15, ry * 0.7, Math.PI * 1.05, Math.PI * 1.95, 12), rng, {
      width: 3 * s, passes: 2, jitter: 1, color: inkC,
    });
    ink(ctx, [[cx - rx * 1.1, cy - ry * 0.25], [cx + rx * 1.1, cy - ry * 0.2]], rng, {
      width: 4 * s, passes: 2, jitter: 0.8, color: inkC,
    });
  }
}

// --- page ---
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const userInput = document.getElementById('user');
const whoEl = document.getElementById('who');
const seedEl = document.getElementById('seedLabel');
const toastEl = document.getElementById('toast');

const NAMES = [
  'ada', 'bob', 'chi', 'dev', 'eva', 'fox', 'gio', 'hex', 'ivy', 'jay',
  'kai', 'leo', 'mia', 'neo', 'omi', 'pix', 'qin', 'rio', 'sol', 'tea',
  'uma', 'val', 'wen', 'xo', 'yuki', 'zed', 'mannay', 'ink', 'doodle',
];

let current = { name: '', seed: 0 };
let toastTimer = 0;
let debounceTimer = 0;
let raf = 0;
const DEBOUNCE_MS = 180;

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1400);
}

function paper() {
  ctx.save();
  ctx.fillStyle = '#e9e4d8';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const g = mulberry32((current.seed ^ 0x9e3779b9) >>> 0 || 99);
  ctx.globalAlpha = 0.045;
  for (let i = 0; i < 2800; i++) {
    ctx.fillStyle = g() > 0.5 ? '#000' : '#fff';
    ctx.fillRect(g() * canvas.width, g() * canvas.height, 1.4, 1.4);
  }
  ctx.restore();
}

function normalizeName(raw) {
  return String(raw ?? '').trim().slice(0, 64);
}

function shareUrl(name) {
  const u = new URL(location.href);
  u.search = '';
  u.hash = '';
  if (name) u.searchParams.set('u', name);
  return u.toString();
}

function setUrl(name, { replace = true } = {}) {
  const url = shareUrl(name);
  const method = replace ? 'replaceState' : 'pushState';
  history[method](null, '', url);
}

function render(name) {
  const n = normalizeName(name) || 'anonymous';
  const seed = hashStr(n.toLowerCase());
  current = { name: n, seed };

  paper();
  const dna = buildFace(seed);
  // slightly high, leave chin room
  drawFace(ctx, canvas.width / 2, canvas.height * 0.48, canvas.width / 118, dna);

  whoEl.textContent = n;
  seedEl.textContent = String(seed);
  document.title = `${n} · doodles-faces`;
}

function scheduleRender(name, { syncUrl = true } = {}) {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    render(name);
    if (syncUrl) setUrl(normalizeName(name));
  });
}

function onUserInput() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    scheduleRender(userInput.value);
  }, DEBOUNCE_MS);
}

function downloadPng() {
  const name = current.name || 'anonymous';
  const a = document.createElement('a');
  a.download = `doodle-${name}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
}

async function share() {
  const name = current.name || 'anonymous';
  const url = shareUrl(name);
  const title = `${name}'s doodle face`;
  try {
    if (navigator.share) {
      // try share with file when possible
      let file;
      try {
        const blob = await new Promise((res) => canvas.toBlob(res, 'image/png'));
        if (blob) file = new File([blob], `doodle-${name}.png`, { type: 'image/png' });
      } catch { /* ignore */ }
      if (file && navigator.canShare?.({ files: [file] })) {
        await navigator.share({ title, text: title, url, files: [file] });
      } else {
        await navigator.share({ title, text: title, url });
      }
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }
  try {
    await navigator.clipboard.writeText(url);
    toast('link copied');
  } catch {
    prompt('copy link', url);
  }
}

function randomName() {
  const base = NAMES[Math.floor(Math.random() * NAMES.length)];
  const n = Math.random() < 0.45 ? base : `${base}${Math.floor(Math.random() * 90 + 10)}`;
  userInput.value = n;
  scheduleRender(n);
  userInput.focus();
  userInput.select();
}

// boot from ?u=
const params = new URLSearchParams(location.search);
const initial = normalizeName(params.get('u') || params.get('user') || '');
userInput.value = initial;
scheduleRender(initial || 'anonymous', { syncUrl: Boolean(initial) });

userInput.addEventListener('input', onUserInput);
userInput.addEventListener('change', () => scheduleRender(userInput.value));
userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    clearTimeout(debounceTimer);
    scheduleRender(userInput.value);
    userInput.blur();
  }
});
document.getElementById('rand').onclick = randomName;
document.getElementById('png').onclick = downloadPng;
document.getElementById('share').onclick = share;

// back/forward
window.addEventListener('popstate', () => {
  const u = normalizeName(new URLSearchParams(location.search).get('u') || '');
  if (u === normalizeName(userInput.value)) return;
  userInput.value = u;
  scheduleRender(u || 'anonymous', { syncUrl: false });
});
</script>
</html>
